<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Лавка Странника</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Marck+Script&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0a08;
  --bg2:#171210;
  --parch:#1f1813;
  --gold:#c9a227;
  --gold-dim:#8a6f1e;
  --ember:#e07b39;
  --text:#e8dcc4;
  --muted:#9a8a6f;
  --danger:#8a2f2f;
  --border:rgba(201,162,39,.22);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Cormorant Garamond', serif;
  min-height:100vh;
  overflow-x:hidden;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(224,123,57,.10), transparent),
    radial-gradient(ellipse 60% 40% at 50% 110%, rgba(201,162,39,.06), transparent);
}
/* Мерцание свечного света */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(circle at 50% 30%, rgba(224,123,57,.05), transparent 60%);
  animation:flicker 4s ease-in-out infinite;
}
@keyframes flicker{
  0%,100%{opacity:.7}
  30%{opacity:1}
  55%{opacity:.5}
  70%{opacity:.9}
  85%{opacity:.6}
}
.container{max-width:520px;margin:0 auto;padding:0 16px 140px;position:relative;z-index:1}

/* Шапка */
header{padding:34px 0 8px;text-align:center}
.rune{font-size:34px;display:block;animation:candle 2.6s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(224,123,57,.7))}
@keyframes candle{0%,100%{transform:scale(1) rotate(-1deg)}50%{transform:scale(1.08) rotate(1deg)}}
h1{
  font-family:'Marck Script', cursive;
  font-size:38px;font-weight:400;color:var(--gold);
  text-shadow:0 0 24px rgba(201,162,39,.35);
  margin-top:8px;letter-spacing:.02em;
}
.subtitle{font-style:italic;color:var(--muted);font-size:16px;margin-top:4px}
.divider{display:flex;align-items:center;gap:12px;margin:22px 0 18px;color:var(--gold-dim)}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent)}
.divider span{font-size:15px;letter-spacing:.25em;text-transform:uppercase}

/* Категории */
.tabs{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;padding-bottom:4px}
.tab{
  flex-shrink:0;padding:8px 18px;border-radius:999px;cursor:pointer;
  background:var(--bg2);border:1px solid var(--border);color:var(--muted);
  font-family:inherit;font-size:16px;transition:all .25s;
}
.tab.active{color:var(--gold);border-color:var(--gold);background:rgba(201,162,39,.08);box-shadow:0 0 16px rgba(201,162,39,.15)}

/* Карточка товара */
.card{
  background:linear-gradient(145deg,var(--parch),var(--bg2));
  border:1px solid var(--border);border-radius:14px;
  padding:16px;margin-bottom:14px;display:flex;gap:14px;
  box-shadow:0 4px 24px rgba(0,0,0,.5), inset 0 0 40px rgba(0,0,0,.3);
  position:relative;overflow:hidden;
  animation:appear .4s ease both;
}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,162,39,.5),transparent);
}
.card .glyph{
  width:58px;height:58px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:32px;background:radial-gradient(circle,rgba(201,162,39,.14),transparent 70%);
  border-radius:50%;border:1px solid var(--border);
}
.card .info{flex:1;min-width:0}
.card h3{font-size:19px;font-weight:700;color:var(--text)}
.card p{font-size:15px;color:var(--muted);font-style:italic;margin:3px 0 8px;line-height:1.35}
.price-row{display:flex;align-items:center;justify-content:space-between}
.price{font-size:19px;font-weight:700;color:var(--gold)}
.price small{font-size:14px;color:var(--gold-dim)}
.stock{font-size:13px;color:var(--muted);font-style:italic}
.add-btn{
  background:linear-gradient(145deg,#3a2c12,#241b0c);
  color:var(--gold);border:1px solid var(--gold-dim);border-radius:10px;
  font-family:inherit;font-size:16px;font-weight:700;
  padding:8px 16px;cursor:pointer;transition:all .2s;
}
.add-btn:active{transform:scale(.94);box-shadow:0 0 18px rgba(201,162,39,.4)}
.add-btn.added{background:var(--gold);color:#1a1207}

/* Корзина (нижняя панель) */
.cart-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  background:linear-gradient(180deg,transparent,var(--bg) 20%);
  padding:24px 16px 20px;
}
.cart-inner{max-width:520px;margin:0 auto}
.cart-btn{
  width:100%;padding:15px;border-radius:14px;cursor:pointer;border:1px solid var(--gold);
  background:linear-gradient(145deg,#4a3815,#2c2110);
  color:var(--gold);font-family:inherit;font-size:18px;font-weight:700;letter-spacing:.03em;
  box-shadow:0 0 26px rgba(201,162,39,.25);
  display:flex;justify-content:space-between;align-items:center;
}
.cart-btn:active{transform:scale(.98)}
.cart-count{background:var(--gold);color:#1a1207;border-radius:999px;padding:2px 12px;font-size:16px}

/* Модалка заказа */
.overlay{
  position:fixed;inset:0;background:rgba(5,3,2,.82);z-index:20;
  display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);
}
.overlay.open{display:flex}
.sheet{
  width:100%;max-width:520px;background:var(--parch);
  border:1px solid var(--border);border-bottom:none;border-radius:20px 20px 0 0;
  padding:22px 20px 34px;max-height:82vh;overflow-y:auto;
  animation:rise .3s ease;
}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-family:'Marck Script',cursive;font-size:28px;color:var(--gold);text-align:center;margin-bottom:12px}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--border);font-size:17px}
.cart-item .qty-ctl{display:flex;align-items:center;gap:10px}
.cart-item button{
  width:28px;height:28px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg2);color:var(--gold);font-size:17px;cursor:pointer;font-family:inherit;
}
.total-row{display:flex;justify-content:space-between;font-size:21px;font-weight:700;color:var(--gold);margin:16px 0}
textarea{
  width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-family:inherit;font-size:16px;padding:12px;resize:none;
  font-style:italic;margin-bottom:14px;
}
textarea::placeholder{color:var(--muted)}
textarea:focus{outline:none;border-color:var(--gold)}
.order-btn{
  width:100%;padding:15px;border-radius:12px;border:none;cursor:pointer;
  background:linear-gradient(145deg,var(--gold),var(--gold-dim));
  color:#1a1207;font-family:inherit;font-size:18px;font-weight:700;letter-spacing:.03em;
  box-shadow:0 0 22px rgba(201,162,39,.35);
}
.order-btn:active{transform:scale(.98)}
.order-btn:disabled{opacity:.5}
.close-x{float:right;background:none;border:none;color:var(--muted);font-size:26px;cursor:pointer;font-family:inherit}

/* Успех */
.success{text-align:center;padding:30px 10px}
.success .sigil{font-size:56px;animation:candle 2s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(224,123,57,.8))}
.success h2{margin:14px 0 8px}
.success p{color:var(--muted);font-style:italic;font-size:16px}

.empty{text-align:center;color:var(--muted);font-style:italic;padding:40px 0;font-size:17px}
.toast{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:30;
  background:var(--parch);border:1px solid var(--gold);color:var(--gold);
  padding:10px 22px;border-radius:999px;font-size:16px;
  opacity:0;transition:opacity .3s;pointer-events:none;
  box-shadow:0 0 20px rgba(201,162,39,.3);
}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="container">
  <header>
    <span class="rune">🕯️</span>
    <h1>Лавка Странника</h1>
    <div class="subtitle">зелья · свечи · реликвии дальних земель</div>
  </header>

  <div class="divider"><span>Товары</span></div>

  <div class="tabs" id="tabs"></div>
  <div id="catalog"></div>
</div>

<div class="cart-bar">
  <div class="cart-inner">
    <button class="cart-btn" id="cartBtn" onclick="openCart()">
      <span>🧺 Сумка странника</span>
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeCart()">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#0d0a08'); tg.setBackgroundColor('#0d0a08'); }

const CATS = { all:'Всё', candles:'🕯️ Свечи', potions:'⚗️ Зелья', relics:'📜 Реликвии' };
let products = [];
let cart = {};          // id -> qty
let activeCat = 'all';

async function loadProducts(){
  const res = await fetch('/api/products');
  products = await res.json();
  renderTabs(); renderCatalog();
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = Object.entries(CATS).map(([k,v]) =>
    `<div class="tab ${k===activeCat?'active':''}" onclick="setCat('${k}')">${v}</div>`).join('');
}
function setCat(k){ activeCat = k; renderTabs(); renderCatalog(); }

function renderCatalog(){
  const el = document.getElementById('catalog');
  const list = products.filter(p => activeCat==='all' || p.category===activeCat);
  el.innerHTML = list.length ? list.map(p => `
    <div class="card">
      <div class="glyph">${p.emoji}</div>
      <div class="info">
        <h3>${esc(p.name)}</h3>
        <p>${esc(p.description||'')}</p>
        <div class="price-row">
          <div><span class="price">${p.price} <small>🪙</small></span>
               <span class="stock"> · осталось ${p.stock}</span></div>
          <button class="add-btn" id="add-${p.id}" onclick="addToCart(${p.id})">В сумку</button>
        </div>
      </div>
    </div>`).join('') : '<div class="empty">Полки пусты… Странник ещё не вернулся из похода.</div>';
}
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function addToCart(id){
  cart[id] = (cart[id]||0)+1;
  updateCartBar();
  const b = document.getElementById('add-'+id);
  b.textContent='✓ В сумке'; b.classList.add('added');
  setTimeout(()=>{ b.textContent='В сумку'; b.classList.remove('added'); }, 900);
  tg?.HapticFeedback?.impactOccurred('light');
}
function cartTotal(){
  return Object.entries(cart).reduce((s,[id,q])=>{
    const p = products.find(x=>x.id==id); return s + (p? p.price*q : 0);
  },0);
}
function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function updateCartBar(){ document.getElementById('cartCount').textContent = cartCount(); }

function openCart(){
  const sheet = document.getElementById('sheet');
  const entries = Object.entries(cart).filter(([_,q])=>q>0);
  if(!entries.length){ toast('Сумка пуста, странник…'); return; }
  sheet.innerHTML = `
    <button class="close-x" onclick="closeCart()">✕</button>
    <h2>Сумка странника</h2>
    ${entries.map(([id,q])=>{
      const p = products.find(x=>x.id==id); if(!p) return '';
      return `<div class="cart-item">
        <span>${p.emoji} ${esc(p.name)}</span>
        <span class="qty-ctl">
          <button onclick="chgQty(${id},-1)">−</button><b>${q}</b><button onclick="chgQty(${id},1)">+</button>
        </span>
        <span style="color:var(--gold)">${p.price*q} 🪙</span>
      </div>`;
    }).join('')}
    <div class="total-row"><span>Итог:</span><span>${cartTotal()} золотых 🪙</span></div>
    <textarea id="comment" rows="2" placeholder="Пожелания к заказу… (необязательно)"></textarea>
    <button class="order-btn" id="orderBtn" onclick="submitOrder()">🖤 Оформить заказ</button>`;
  document.getElementById('overlay').classList.add('open');
}
function closeCart(){ document.getElementById('overlay').classList.remove('open'); }
function chgQty(id,d){
  cart[id]=(cart[id]||0)+d;
  if(cart[id]<=0) delete cart[id];
  updateCartBar();
  if(cartCount()===0){ closeCart(); } else { openCart(); }
}

async function submitOrder(){
  const btn = document.getElementById('orderBtn');
  btn.disabled = true; btn.textContent = 'Хранитель читает свиток…';
  const items = Object.entries(cart).map(([id,qty])=>({id:+id,qty}));
  try{
    const res = await fetch('/api/order',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ initData: tg?.initData || '', cart: items, comment: document.getElementById('comment').value })
    });
    const data = await res.json();
    if(data.ok){
      tg?.HapticFeedback?.notificationOccurred('success');
      cart = {}; updateCartBar();
      document.getElementById('sheet').innerHTML = `
        <div class="success">
          <div class="sigil">🕯️</div>
          <h2>Заказ №${data.order_id} принят</h2>
          <p>Свеча уже горит на прилавке.<br>Хранитель лавки напишет тебе в боте.</p>
        </div>`;
      setTimeout(closeCart, 3500);
      loadProducts();
    } else {
      toast('Не вышло: ' + (data.error||'ошибка')); btn.disabled=false; btn.textContent='🖤 Оформить заказ';
    }
  }catch(e){
    toast('Связь с лавкой прервалась…'); btn.disabled=false; btn.textContent='🖤 Оформить заказ';
  }
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

loadProducts();
</script>
</body>
</html>
