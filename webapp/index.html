<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Лавка Странника - Идеальные Кнопки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #1a1210;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body, html {
  background-color: var(--bg);
  /* Убираем стандартный скролл, сделаем свой, чтобы фон был 100% статичным на iOS/Android */
  height: 100%;
  overflow: hidden; 
}

/* Статичный каменный фон */
.fixed-bg {
  position: fixed;
  top: 0; 
  left: 0; 
  width: 100%; 
  height: 100%;
  background: url('stone_wall_bg.jpg') center center / cover no-repeat;
  z-index: 0;
}

/* Основной контейнер, который скроллится */
.scroll-container {
  position: relative;
  width: 100%;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  z-index: 1;
}

.wrap {
  max-width: 520px;
  margin: 0 auto;
  position: relative;
}

/* ===== HERO SECTION ===== */
.hero {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: url('bg.jpg?v=1') center center / contain no-repeat;
  background-color: var(--bg); /* Закрывает каменный фон под собой */
  z-index: 10;
  /* Легкая тень снизу для перехода */
  box-shadow: 0 10px 20px rgba(0,0,0,0.8);
}

/* ===== КНОПКИ ===== */
.pixel-btn {
  position: absolute;
  width: 64px;
  height: 64px;
  
  background-size: 100% 100%; 
  background-position: center;
  background-repeat: no-repeat;
  
  border: none;
  background-color: transparent; 
  cursor: pointer;
  outline: none;
  z-index: 30;
  
  filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.7));
  transition: transform 0.1s, filter 0.1s;
}

.pixel-btn:active {
  transform: translateY(4px);
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.9));
}

.btn-chatgpt {
  background-image: url('gpt_user.png?v=5'); 
  bottom: 11.5%; 
  left: 20%;
}

.btn-gemini {
  background-image: url('gemini_user.png?v=5'); 
  bottom: 11.5%; 
  right: 20%;
}

/* ===== КАРТОЧКИ ТОВАРОВ ===== */
.shop-content {
  padding: 20px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  padding-bottom: 40px;
}

.card {
  background: rgba(20, 15, 15, 0.75); /* Полупрозрачный темный фон */
  border: 2px solid #4a3424; /* Деревянная рамка */
  border-radius: 12px;
  height: 180px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #e0d0b8;
  font-family: sans-serif;
  font-weight: bold;
  box-shadow: 0 6px 12px rgba(0,0,0,0.6);
  backdrop-filter: blur(4px); /* Размытие каменного фона под карточкой */
  transition: transform 0.1s;
}

.card:active {
  transform: scale(0.96);
}

/* Декоративная иконка зелья или свитка в карточке */
.card-icon {
  width: 48px;
  height: 48px;
  background: #3a2618;
  border-radius: 8px;
  margin-bottom: 12px;
  border: 1px solid #6b4c3a;
}
</style>
</head>
<body>

<!-- Статичный фон (Каменная стена с факелами) -->
<div class="fixed-bg"></div>

<!-- Скроллируемая область -->
<div class="scroll-container">
  <div class="wrap">
    <section class="hero">
      <!-- Кнопка ChatGPT -->
      <button class="pixel-btn btn-chatgpt" onclick="playClick()"></button>

      <!-- Кнопка Gemini -->
      <button class="pixel-btn btn-gemini" onclick="playClick()"></button>
    </section>

    <!-- Секция товаров -->
    <section class="shop-content">
      <!-- Тестовые карточки -->
      <div class="card"><div class="card-icon"></div>Товар 1</div>
      <div class="card"><div class="card-icon"></div>Товар 2</div>
      <div class="card"><div class="card-icon"></div>Товар 3</div>
      <div class="card"><div class="card-icon"></div>Товар 4</div>
      <div class="card"><div class="card-icon"></div>Товар 5</div>
      <div class="card"><div class="card-icon"></div>Товар 6</div>
    </section>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  function playClick() {
    if (tg && tg.HapticFeedback) {
      tg.HapticFeedback.impactOccurred('medium');
    }
  }
</script>
</body>
</html>
